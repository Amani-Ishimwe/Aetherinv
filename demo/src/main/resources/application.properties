# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventory_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:tequiero2024}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000

# Server Port
server.port=8080

# Logging
logging.level.org.springframework.security=DEBUG

# Scheduling Configuration
# Run the statistics report every 5 minutes (using a standard cron expression)
inventory.scheduling.cron=0 */5 * * * *
# Check low stock every 1 minute (60000 ms)
inventory.scheduling.low-stock-check-rate=60000
# Initial startup delay of 10 seconds (10000 ms) before first run
inventory.scheduling.initial-delay=10000
# Low stock threshold
inventory.scheduling.low-stock-threshold=5
